services:
  - type: web
    name: zero-market-lab-v2
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: pip install -r requirements-public.txt && python scripts/build_public_demo.py
    startCommand: python scripts/run_research_ui.py
    healthCheckPath: /healthz
    envVars:
      - key: ZML_DATA_MODE
        value: PUBLIC_DEMO
